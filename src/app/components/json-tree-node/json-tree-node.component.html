<div *ngIf="closing" class="closing-row" aria-hidden="true" [style.padding-left.px]="depth * 20 + 20">
  <span class="bracket">{{ closeBracket }}</span>
</div>

<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- keyboard access is handled by the tree (arrow keys, Enter) -->
<div *ngIf="!closing"
  class="node-row"
  [class.leaf]="!isContainer"
  role="treeitem"
  [attr.aria-level]="depth + 1"
  [attr.aria-expanded]="isContainer ? !node.collapsed : null"
  [attr.aria-selected]="ctx.selectedPath() === node.path"
  [style.padding-left.px]="depth * 20"
  [attr.data-path]="node.path"
  [class.selected]="ctx.selectedPath() === node.path"
  [class.active-match]="ctx.activePath() === node.path"
  [class.path-match]="ctx.pathMode && node.match"
  [class.flash]="ctx.flashPath() === node.path"
  [class.mark-add]="node.mark === 'add'"
  [class.mark-del]="node.mark === 'del'"
  [class.mark-chg]="node.mark === 'chg'"
  (click)="onRowClick()">

  <span *ngIf="isContainer" class="toggle-btn" [class.expanded]="!node.collapsed">
    <mat-icon>chevron_right</mat-icon>
  </span>
  <span *ngIf="!isContainer" class="toggle-placeholder"></span>

  <ng-container *ngIf="node.key !== null">
    <span class="node-key" [innerHTML]="keyHtml"></span>
    <span class="node-colon">:</span>
  </ng-container>

  <ng-container *ngIf="isContainer">
    <span *ngIf="node.collapsed" class="item-count">{{ node.size }}</span>
    <span *ngIf="!node.collapsed" class="bracket">{{ openBracket }}</span>
  </ng-container>
  <span *ngIf="!isContainer" class="node-value" [ngClass]="'type-' + node.type" [innerHTML]="valueHtml"></span>
  <button type="button" *ngIf="node.embedsJson" class="json-chip" tabindex="-1"
    title="This string holds JSON. Click to unwrap it." (click)="onUnwrapClick($event)">JSON</button>

  <span *ngIf="node.markOwn" class="diff-gutter">{{ markSymbol }}</span>
  <span *ngIf="!node.markOwn && isContainer && node.hasChange" class="change-dot" title="Contains changes"></span>
</div>
