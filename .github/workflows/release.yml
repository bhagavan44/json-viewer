name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Reads the conventional commits since the last release and keeps a release PR open that bumps
  # the version in package.json and updates CHANGELOG.md. Merging that PR tags the release and
  # publishes it on GitHub.
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
