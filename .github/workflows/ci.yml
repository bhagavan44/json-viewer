name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Skips the jobs below when only docs or other non-source files changed. A job skipped by `if`
  # still satisfies the required `test-and-build` check, unlike a workflow-level `paths` filter.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # For a PR, HEAD is the merge commit and HEAD^1 is the base branch.
          if [ "$EVENT" = pull_request ]; then base=HEAD^1; else base=$BEFORE; fi
          if git cat-file -e "$base^{commit}" 2>/dev/null && git diff --quiet "$base" HEAD -- \
            src public e2e angular.json package.json package-lock.json 'tsconfig*.json' \
            playwright.config.ts stylelint.config.mjs .github/workflows/ci.yml; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  test-and-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Style lint
        run: npm run lint:styles

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Production build
        run: npm run build

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
